[package]
name = "signal-flow"
version = "59.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/signal-flow"
description = "Ordinary Flow Nexus Signal contract."
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "flow-ethos/datom", "signal/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598", optional = true }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "6d4eb74", default-features = false }
flow-ethos = { git = "https://github.com/LiGoldragon/flow", rev = "5c61d666", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "1976e45" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"

# The generated contract is committed byte for byte from its ethos source.
[lints.clippy]
large_enum_variant = "allow"
